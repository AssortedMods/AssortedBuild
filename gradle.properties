# One version for the plugin and the catalog: a mod pins it once as assortedbuild_version. The
# first two segments track the Minecraft version the catalog is for; the third is this repository's
# own release counter. A Minecraft update starts a new line.
version=26.2.0
group=com.grim3212.assorted.build
# Gradle
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.configuration-cache=false
