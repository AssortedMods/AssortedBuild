name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the plugin and catalog to maven.grimoid.com once the checks pass
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build

      - name: Build
        run: ./gradlew build --stacktrace

  # The only real test of the plugin is a mod built with it. Scaffolds one from the template
  # against the plugin published to the runner's local maven, and builds it end to end - the
  # Minecraft setup included, which is why it has its own hour.
  template:
    name: Template builds
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build

      - name: Publish to the local maven
        run: ./gradlew publishToMavenLocal --stacktrace

      - name: Scaffold a mod
        run: fleet/fleet new "Assorted Example" example "A mod scaffolded to check the template." --into "$RUNNER_TEMP/AssortedExample"

      - name: Build it
        working-directory: ${{ runner.temp }}/AssortedExample
        run: ./gradlew build --stacktrace

  # maven.grimoid.com is a static site served by GitHub Pages from grim3212/maven, so publishing
  # is: check that repository out, publish into its mods/ directory, push. MAVEN_DEPLOY_KEY is a
  # deploy key of that repository with write access.
  publish:
    name: Publish to Maven
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [ build, template ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: maven
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build

      - name: The deploy key is set
        env:
          MAVEN_DEPLOY_KEY: ${{ secrets.MAVEN_DEPLOY_KEY }}
        run: |
          if [ -z "$MAVEN_DEPLOY_KEY" ]; then
            echo "::error::MAVEN_DEPLOY_KEY is not set - nothing could be pushed to grim3212/maven"
            exit 1
          fi

      - name: Check out the maven
        uses: actions/checkout@v4
        with:
          repository: grim3212/maven
          ssh-key: ${{ secrets.MAVEN_DEPLOY_KEY }}
          path: maven

      - name: Publish into it
        env:
          ASSORTED_MAVEN: ${{ github.workspace }}/maven/mods
        run: ./gradlew publishAllPublicationsToAssortedModsRepository --stacktrace

      # Rebases before pushing so two releases landing at once (AssortedLib and this, say) do not
      # reject each other; their files never overlap.
      - name: Push
        working-directory: maven
        run: |
          version="$(sed -n 's/^version=//p' ../gradle.properties)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "AssortedBuild $version"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1

      - name: Summary
        run: |
          version="$(sed -n 's/^version=//p' gradle.properties)"
          {
            echo "Published AssortedBuild \`$version\` to <https://maven.grimoid.com/mods/com/grim3212/assorted/build/>."
            echo "Pages serves it within about ten minutes. A mod picks it up by setting"
            echo
            echo "    assortedbuild_version=$version"
            echo
            echo "in its gradle.properties, or \`fleet/fleet bump-build $version\` does it for all of them."
          } >> "$GITHUB_STEP_SUMMARY"
