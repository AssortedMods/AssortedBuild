name: Set up the build
description: JDK 25 and Gradle with its caches restored.

# Used by this repository's own workflow only. mod-build.yml cannot reference it - a reusable
# workflow resolves `./` against the calling repository - so it inlines the same two steps.
runs:
  using: composite
  steps:
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '25'

    # Restores ~/.gradle and writes it back from the branch's own runs only, so a pull request
    # reads the cache but never poisons it.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
