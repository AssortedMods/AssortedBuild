# The one place a shared version lives. Published as com.grim3212.assorted.build:catalog at this
# repository's own version and pulled into every mod build by the settings plugin, so a bump here
# reaches a mod when it bumps assortedbuild_version - never before.
#
# Per-mod versions stay in each mod's gradle.properties: its own `version`, and the
# `assortedlib_version` it actually requires (a mod declares its minimum, not the newest).
[versions]
java = "25"
minecraft = "26.3"
minecraft-range = "[26.3]"
neoform = "26.3-1"
neoforge = "26.3.0.95"
neoforge-range = "[26.3.0.95,)"
fabric-loader = "0.19.5"
fabric-api = "0.164.0+26.3"
fabric-minecraft-range = "26.3"
mixin = "0.8.7"
jei-minecraft = "26.3"
jei = "31.16.0.87"

# Tooling. Loom is what 1.18-SNAPSHOT resolved to on the day this was pinned; a snapshot under
# every mod at once is how one upstream push breaks the whole fleet.
moddev = "2.0.148"
fabric-loom = "1.18.4"
mod-publish = "2.2.0"
foojay = "1.0.0"

[libraries]
moddev-gradle = { module = "net.neoforged:moddev-gradle", version.ref = "moddev" }
fabric-loom = { module = "net.fabricmc:fabric-loom", version.ref = "fabric-loom" }
mod-publish-plugin = { module = "me.modmuss50:mod-publish-plugin", version.ref = "mod-publish" }
foojay-resolver = { module = "org.gradle.toolchains:foojay-resolver", version.ref = "foojay" }
