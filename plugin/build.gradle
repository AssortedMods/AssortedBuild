plugins {
    id 'groovy-gradle-plugin'
    id 'maven-publish'
}

// The loader plugins are dependencies of this jar, so a mod's settings only names one plugin and
// gets the pinned MDG, Loom and mod-publish-plugin versions with it.
repositories {
    gradlePluginPortal()
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    implementation libs.moddev.gradle
    implementation libs.fabric.loom
    implementation libs.mod.publish.plugin
    implementation libs.foojay.resolver
}

// The plugin runs in the Gradle daemon, not in Minecraft, and Loom 1.18 is built for Java 25, so this
// stays on 25 while the catalog's `java` (what the mods compile for) is 21 on this line.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// The settings plugin reads its own version from this to fetch the matching catalog.
processResources {
    inputs.property 'version', project.version
    filesMatching('assortedbuild.properties') {
        expand version: project.version
    }
}
