import com.grim3212.assorted.build.Assorted

// The loader-agnostic module. Compiles against plain, deobfuscated Minecraft through ModDevGradle's
// "vanilla mode" (NeoForm, no loader), which replaced the unmaintained VanillaGradle.
plugins {
    id 'com.grim3212.assorted.java'
    id 'net.neoforged.moddev'
}

base.archivesName = "${mod_id}-common-${minecraft_version}"

neoForge {
    neoFormVersion = neoform_version

    // Off by default: the loader modules are what actually get run.
    runs {
        if (Assorted.flag(project, 'common_runs_enabled')) {
            client {
                client()
                gameDirectory = project.file('run')
            }
            server {
                server()
                gameDirectory = project.file('run')
            }
        }
    }
}

dependencies {
    compileOnly "org.spongepowered:mixin:${mixin_version}"

    if (Assorted.flag(project, 'jei_enabled')) {
        compileOnly "mezz.jei:jei-${jei_minecraft_version}-common-api:${jei_version}"
    }

    // Absent only in AssortedLib itself.
    if (project.hasProperty('assortedlib_version')) {
        compileOnly "com.grim3212.assorted.lib:assortedlib-common-${minecraft_version}:${assortedlib_version}"
    }
}

processResources {
    filesMatching('pack.mcmeta') {
        expand 'mod_name': mod_name
    }
}

// A family's shared namespace, icons and manual order, written once in the root gradle.properties and generated into
// each mod's own package: the same class in two jars would be a split package on NeoForge. A bundle has no code.
if (project.hasProperty('family_id') && !project.hasProperty('bundled_mods')) {
    String familyPackage = project.group.toString()
    String familyId = project.family_id
    List<String> familyIcons = Assorted.modDirs(project.findProperty('family_icons') as String)
    int manualOrder = (project.findProperty('family_manual_order') ?: '0') as int

    def generateFamily = tasks.register('generateFamily') {
        def output = layout.buildDirectory.dir('generated/sources/family')
        inputs.property('package', familyPackage)
        inputs.property('id', familyId)
        inputs.property('icons', familyIcons)
        inputs.property('manualOrder', manualOrder)
        outputs.dir(output)
        doLast {
            File file = output.get().file("${familyPackage.replace('.', '/')}/Family.java").asFile
            file.parentFile.mkdirs()
            String icons = familyIcons.collect { "Identifier.parse(\"$it\")" }.join(', ')
            file.text = """package ${familyPackage};

import net.minecraft.resources.Identifier;

import java.util.List;

/** Generated by AssortedBuild from the family repo's gradle.properties; edit those, not this. */
public final class Family {

    /** The namespace this family's mods share: their creative tab, manual section and the ids they used to have. */
    public static final String ID = "${familyId}";
    /** The family's tab, manual section and advancement root are drawn with the first of these installed. */
    public static final List<Identifier> ICONS = List.of(${icons});
    /** Where the family's manual section sorts in the index. */
    public static final int MANUAL_ORDER = ${manualOrder};

    private Family() {
    }
}
"""
        }
    }
    sourceSets.main.java.srcDir(generateFamily)
}
