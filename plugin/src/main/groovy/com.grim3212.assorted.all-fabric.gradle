import com.grim3212.assorted.build.Assorted
import com.grim3212.assorted.build.GametestLog

// A family repo's mods in one Fabric game, for trying them together: `./gradlew :all:fabric:runClient`.
// `:all:fabric:runGameTest` runs every mod's gametests in that one game, where a test needing a sibling mod
// stops skipping itself.
plugins {
    id 'java'
    id 'net.fabricmc.fabric-loom-remap'
}

def familyDirs = Assorted.modDirs(findProperty('assorted_mods') as String)
def minecraftVersion = Assorted.catalogVersion(project, 'minecraft')

// The game runs on this project's toolchain, and Gradle's own Java is newer than 1.21.1 can run on:
// its LWJGL dies on Java 25 with an unsupported JNI version. So the run takes the catalog's Java.
java.toolchain.languageVersion = JavaLanguageVersion.of(Assorted.catalogVersion(project, 'java') as int)

repositories {
    mavenLocal()
    maven {
        name = 'AssortedMods'
        url = 'https://maven.grimoid.com/mods'
    }
    // Where a mod's optional integrations such as JEI come from, since this run pulls those in too.
    maven {
        name = 'BlameJared Maven (CrT / Bookshelf)'
        url = 'https://maven.blamejared.com'
        content {
            excludeGroupByRegex 'net\\.minecraft.*'
            excludeGroupByRegex 'net\\.fabricmc.*'
            excludeGroupByRegex 'net\\.neoforged.*'
        }
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev'
        content {
            excludeGroupByRegex 'net\\.minecraft.*'
            excludeGroupByRegex 'net\\.fabricmc.*'
            excludeGroupByRegex 'net\\.neoforged.*'
        }
    }
}

// Their source sets are read below, so each mod is configured first, common before the loader.
familyDirs.each {
    evaluationDependsOn(":$it:common")
    evaluationDependsOn(":$it:fabric")
}

// A bundle has no code of its own; the mods it nests are here already.
def modDirs = familyDirs.findAll { !project(":$it:fabric").findProperty('bundled_mods') }

dependencies {
    minecraft "com.mojang:minecraft:$minecraftVersion"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${Assorted.catalogVersion(project, 'fabric-loader')}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${Assorted.catalogVersion(project, 'fabric-api')}"
    modImplementation "com.grim3212.assorted.lib:assortedlib-fabric-$minecraftVersion:$assortedlib_version"
    // A project's default artifact is its remapped, intermediary jar, which a dev run on Mojang names
    // cannot load, so each mod comes in through Loom's namedElements instead. Its own mod
    // dependencies are remapped inside that project only, so they are not taken through it either;
    // what the mods depend on is remapped here, JEI included when any of them uses it.
    modDirs.each {
        implementation(project(path: ":$it:fabric", configuration: 'namedElements')) { transitive = false }
        runtimeOnly rootProject.project(":$it:fabric").sourceSets.gametest.output
    }
    if (modDirs.any { Assorted.flag(rootProject.project(":$it:fabric"), 'jei_enabled') }) {
        modImplementation "mezz.jei:jei-${Assorted.catalogVersion(project, 'jei-minecraft')}-fabric:${Assorted.catalogVersion(project, 'jei')}"
    }
}

loom {
    mods {
        modDirs.each { dir ->
            Project mod = project(":$dir:fabric")
            "${mod.mod_id}" {
                sourceSet('main', mod)
            }
            "${mod.mod_id}_gametest" {
                sourceSet('gametest', mod)
            }
        }
    }

    runs {
        client {
            client()
            setConfigName('Fabric Client (all mods)')
            ideConfigGenerated(true)
            runDir('../../../run/all-fabric')
            programArgs '--username', 'Dev'
        }
        server {
            server()
            setConfigName('Fabric Server (all mods)')
            ideConfigGenerated(true)
            runDir('../../../run/all-fabric')
        }
        gameTest {
            server()
            setConfigName('Fabric Game Test (all mods)')
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${file('build/gametest/report.xml')}"
            runDir('build/gametest')
        }
    }
}

GametestLog.checkAfter(project, 'runGameTest', file('build/gametest'))

// Nothing of its own to ship. The remapping plugin's remapJar reads jar's output, so it goes too, or
// `./gradlew build` fails on the missing dev jar.
tasks.named('jar') { enabled = false }
tasks.matching { it.name in ['remapJar', 'remapSourcesJar'] }.configureEach { enabled = false }
